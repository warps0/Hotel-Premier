<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Premier</title>
    <link rel="stylesheet" th:href="@{/css/verEstadoHabitaciones.css}">
</head>

<body>
    <div class="container">
        <h1>Estado de Habitaciones</h1>
        <div class="search-section" id="searchSection">
            <p class="instrucciones">Complete las fechas y presione Buscar para ver el estado de las habitaciones:</p>

            <div style="border: 2px solid #333; padding: 20px; margin:auto; max-width: 900px;">
                <h3 style="margin-bottom: 20px;">Rango de Fechas</h3>

                <div class="date-inputs">
                    <div class="date-field">
                        <label for="startDate">Desde (fecha de inicio):</label>
                        <input type="date" id="startDate" required>
                    </div>

                    <div class="date-field">
                        <label for="endDate">Hasta (fecha de fin):</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>
                <div class="botones-centrados">
                    <button class="btn-buscar" onclick="buscarHabitaciones()">Buscar</button>
                </div>

            </div>

            <div class="botones-izquierda">
                <button onclick="botonCancelar('¿Desea cancelar ver estado de habitación?')" type="button"
                    class="btn-cancelar">Cancelar</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">

            <div class="table-container">
                <table id="roomTable">
                    <thead>
                        <tr>
                            <th class="room-type-cell">Tipo de Habitación</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color room-disponible"></div>
                    <span>Disponible</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color room-ocupada"></div>
                    <span>Ocupada</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color room-fuera-servicio"></div>
                    <span>Fuera de servicio</span>
                </div>
            </div>

            <div class="botones-contenedor">
                <button onclick="botonCancelar('¿Desea cancelar ver estado de habitación?')" type="button"
                    class="btn-cancelar">Cancelar</button>
        
                <button class="btn-aceptar" onclick="siguiente()" type="button"> Siguiente </button>
            </div>

        </div>
    </div>
    <script th:src="@{/js/reservarHabitacion.js}"></script>
    <script th:src="@{/js/confirmarReserva.js}"></script>
    <script th:src="@{/js/botonCancelar.js}"></script>
</body>

</html>
