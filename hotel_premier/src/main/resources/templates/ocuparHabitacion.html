<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Premier</title>
    <link rel="stylesheet" th:href="@{/css/ocuparHabitacion.css}">
</head>

<body>
    <h1>Ocupar habitación</h1>

    <p class="instrucciones">Complete los datos del responsable de la reserva:</p>

    <form th:action="@{/habitaciones/ocupar}" method="get">
        <input type="hidden" name="buscar" value="true">

        <div class="search-container">
            <span class="fieldset-title">Datos Responsable Reserva</span>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="escriba un nombre aquí">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="escriba un apellido aquí">
            </div>

            <div class="form-group">
                <label for="contacto">Teléfono:</label>
                <input type="text" id="contacto" name="contacto" placeholder="escriba un teléfono aquí">
            </div>

            <div class="botones-centrados">
                <button type="submit" class="btn-buscar">Buscar</button>
            </div>
        </div>

        <div class="botones-izquierda">
            <button onclick="botonCancelar('¿Desea cancelar ocupar habitación?')" type="button"
                class="btn-cancelar">Cancelar</button>
        </div>
    </form>

    <script th:src="@{/js/botonCancelar.js}"></script>
</body>

</html>
