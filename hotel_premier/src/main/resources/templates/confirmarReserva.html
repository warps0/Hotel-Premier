<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Reservas</title>
    <link rel="stylesheet" th:href="@{/css/confirmarReserva.css}">
</head>

<body>
    <div class="container">
        <h1>Confirmar Reservas</h1>

        <div class="total-reservas" id="totalReservas">
            Total de habitaciones: 0
        </div>

        <div class="reservas-list" id="reservasList">
            <div class="no-reservas">No hay reservas pendientes</div>
        </div>

        <div class="guest-info" style="margin-top:20px;">
            <h3>Datos del responsable</h3>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <input id="nombre" placeholder="Nombre" style="flex:1;padding:8px;font-size:16px;" />
                <input id="apellido" placeholder="Apellido" style="flex:1;padding:8px;font-size:16px;" />
                <input id="contacto" placeholder="Teléfono"
                    style="flex:1;padding:8px;font-size:16px;" />
            </div>
        </div>

        <div class="buttons">
            <button class="btn-rechazar" onclick="rechazar()">Cancelar</button>
            <button class="btn-aceptar" onclick="aceptar()">Confirmar Todas</button>
        </div>
    </div>
    <script th:src="@{/js/confirmarReserva.js}"></script>
</body>

</html>
