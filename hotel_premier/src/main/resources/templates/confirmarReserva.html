<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Reservas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            background: white;
            border: 3px solid black;
            border-radius: 8px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .reservas-list {
            margin-bottom: 30px;
        }

        .reserva-card {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }

        .reserva-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .habitacion-numero {
            background-color: #ff9800;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
        }

        .btn-eliminar {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-eliminar:hover {
            background-color: #cc0000;
        }

        .reserva-details {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .label {
            font-weight: bold;
        }

        .value {
            color: #555;
        }

        .datetime-row {
            display: grid;
            grid-template-columns: 150px 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid black;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-rechazar {
            background-color: #ffcccc;
            color: #990000;
        }

        .btn-rechazar:hover {
            background-color: #ff9999;
        }

        .btn-aceptar {
            background-color: #ccffcc;
            color: #006600;
        }

        .btn-aceptar:hover {
            background-color: #99ff99;
        }

        .no-reservas {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        .total-reservas {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirmar Reservas</h1>
        
        <div class="total-reservas" id="totalReservas">
            Total de habitaciones: 0
        </div>

        <div class="reservas-list" id="reservasList">
            <div class="no-reservas">No hay reservas pendientes</div>
        </div>

        <div class="guest-info" style="margin-top:20px;">
            <h3>Datos del responsable</h3>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <input id="nombre" placeholder="Nombre" style="flex:1;padding:8px;font-size:16px;" />
                <input id="apellido" placeholder="Apellido" style="flex:1;padding:8px;font-size:16px;" />
                <input id="contacto" placeholder="Contacto (teléfono/email)" style="flex:1;padding:8px;font-size:16px;" />
            </div>
        </div>

        <div class="buttons">
            <button class="btn-rechazar" onclick="rechazar()">Cancelar</button>
            <button class="btn-aceptar" onclick="aceptar()">Confirmar Todas</button>
        </div>
    </div>
<script th:src="@{/js/confirmarReserva.js}"></script>
</body>
</html>
