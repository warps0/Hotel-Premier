<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Premier - Buscar Huésped</title>
    <link rel="stylesheet" th:href="@{/css/buscarHuesped.css}">
</head>

<body>
    <h1>Buscar Huésped</h1>

    <p class="instrucciones">Ingrese uno o más datos para filtrar la búsqueda, o presione Buscar para ver la lista
        completa de huéspedes:</p>

    <form th:action="@{/huesped/buscar}" method="get">
    <input type="hidden" name="buscar" value="true">
    
    <div class="search-container">
        <span class="fieldset-title">Datos Huésped</span>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="escriba un nombre aquí">
        </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="escriba un apellido aquí">
            </div>

            <div class="form-group">
                <label for="documento">Documento:</label>
                <div class="document-group">
                    <input type="text" id="documento" name="documento" placeholder="escriba un documento aquí">
                    <select id="tipoDocumento" name="tipoDocumento">
                        <option value="">Seleccione un tipo de documento</option>
                        <option value="DNI">DNI</option>
                        <option value="LE">LE</option>
                        <option value="LC">LC</option>
                        <option value="PASAPORTE">Pasaporte</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
            </div>

            <div class="button-container">
                <button type="submit" class="btn-search">Buscar</button>
            </div>
        </div>

    
            <button onclick="botonCancelar('¿Desea cancelar buscar un huésped?')" type="button"
                class="btn-form btn-cancelar">Cancelar</button>
    
    </form>

    <script th:src="@{/js/botonCancelar.js}"></script>
</body>

</html>
