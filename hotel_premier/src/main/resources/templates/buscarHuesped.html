<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Premier</title>
    <link rel="stylesheet" th:href="@{/css/buscarHuesped.css}">

</head>

<body>
    <h1>Buscar Huésped</h1>

    <p class="instrucciones">Ingrese uno o más datos para filtrar la búsqueda, o presione Buscar para ver la lista
        completa de huéspedes:</p>

    <form th:action="@{/huesped/buscar}" method="get">
        <div class="search-container">
            <span class="fieldset-title">Datos Huésped</span>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" th:value="${nombre}" placeholder="escriba un nombre aquí">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" th:value="${apellido}"
                    placeholder="escriba un apellido aquí">
            </div>

            <div class="form-group">
                <label for="documento">Documento:</label>
                <div class="document-group">
                    <input type="text" id="documento" name="documento" th:value="${docIdentidad}"
                        placeholder="escriba un documento aquí">
                    <select id="tipoDocumento" name="tipoDocumento" th:value="*{tipoDoc}">
                        <option value=DNI>DNI</option>
                        <option value=LE>LE</option>
                        <option value=LC>LC</option>
                        <option value=PASAPORTE>Pasaporte</option>
                        <option value=OTRO>Otro</option>
                    </select>
                </div>
            </div>

            <div class="button-container">
                <button type="submit" class="btn-search">Buscar</button>
            </div>
        </div>

        <div class="botones">
            <button onclick="botonCancelar('¿Desea cancelar el alta del huésped?')" type="button"
                class="btn-form btn-cancelar">Cancelar</button>
        </div>

    </form>

 <script th:src="@{/js/botonCancelar.js}"></script>
</body>

</html>
